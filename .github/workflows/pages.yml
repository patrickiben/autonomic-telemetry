name: Deploy GitHub Pages (manual)

# Publishing is an explicit repository-owner action; pushes do not deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage public static files only
        run: |
          mkdir _site
          cp index.html Autonomic_Telemetry_Console.html Autonomic_Telemetry_Field_Guide.html Autonomic_Telemetry_Signal_Lab.html _site/
          cp research-math.js _site/
          cp -R examples _site/examples
          cp README.md _site/
          mkdir _site/docs
          cp docs/*.md _site/docs/
          cp docs/*.png _site/docs/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
