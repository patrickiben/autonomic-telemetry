name: Deploy GitHub Pages (manual)

# Publishing is an explicit repository-owner action; pushes do not deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Autonomic Telemetry moved to Body Signal Labs (patrickiben.github.io/body-signal-labs/autonomic/).
      # This site now publishes only redirect pages: each old page forwards to the same page there,
      # and 404.html forwards every other old path (docs, pictures, examples) to the same path there.
      - name: Stage the redirect pages only
        run: |
          mkdir _site
          cp redirect/*.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
